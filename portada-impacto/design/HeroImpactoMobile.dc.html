<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fundación · Portada de impacto móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Instrument+Serif:ital@1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
.ser{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
.spin{animation:spin 22s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.w{display:inline-block;animation:wu 1s cubic-bezier(.16,.84,.24,1) both}
@keyframes wu{from{opacity:0;transform:translateY(60%);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.fadein{animation:fi 1s cubic-bezier(.2,.7,.2,1) both}.d3{animation-delay:.45s}.d4{animation-delay:.6s}
@keyframes fi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.kb{animation:kb 14s ease-out both}@keyframes kb{from{transform:scale(1.15)}to{transform:scale(1)}}
.prog{transform-origin:left;animation:prog 7s linear both}@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #050E1A; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column">
  <img class="kb" src="../assets/hero-3d-fundacion.jpg" alt="" style="position: absolute; left: -40px; right: -40px; top: 230px; width: 470px; height: 360px; object-fit: cover; object-position: 78% 55%">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,14,26,.96) 0%, rgba(5,14,26,.55) 30%, rgba(5,14,26,0) 50%, rgba(5,14,26,.85) 72%, rgba(5,14,26,1) 100%)"></div>
  <div style="position: relative; z-index: 3; height: 72px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.08)">
    <dc-import name="Logo" tone="dark" size="xs" hint-size="200px,40px"></dc-import>
    <a href="MobileMenu.dc.html" aria-label="Abrir menú" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.1); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"></path></svg></a>
  </div>
  <div style="position: relative; z-index: 2; padding: 26px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <span class="fadein" style="align-self: flex-start; background: #F4914D; color: #0B2A4F; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 11px; letter-spacing: .1em">{{cur.tag}}</span>
    <h1 style="margin: 0; font-size: 46px; line-height: 1; letter-spacing: -0.04em; font-weight: 800"><sc-for list="{{cur.words}}" as="w" hint-placeholder-count="5"><span class="{{w.cls}}" style="animation-delay: {{w.d}}; color: {{w.c}}">{{w.t}}</span> </sc-for></h1>
  </div>
  <div style="position: relative; z-index: 2; margin-top: auto; padding: 0 20px 26px; display: flex; flex-direction: column; gap: 16px">
    <p class="fadein d3" style="margin: 0; font-size: 15.5px; line-height: 1.55; color: #C9DAF0">{{cur.lead}}</p>
    <a class="fadein d4" href="https://wa.me/573209038228" style="height: 56px; border-radius: 999px; background: #F4914D; color: #0B2A4F; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 24px; font-weight: 800; font-size: 15px">Agenda tu cita <span style="width: 40px; height: 40px; border-radius: 50%; background: #0B2A4F; color: #fff; display: inline-flex; align-items: center; justify-content: center">→</span></a>
    <a href="https://checkout.wompi.co/l/VPOS_sUGqKF" style="height: 52px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">Donar</a>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button onClick="{{t.pick}}" aria-label="{{t.label}}" style="flex: 1; height: 44px; border: 0; background: none; padding: 20px 0; cursor: pointer"><span style="display: block; height: 3px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden"><sc-if value="{{t.active}}" hint-placeholder-val="{{ false }}"><span class="prog" style="display: block; height: 100%; background: #F4914D"></span></sc-if></span></button>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; right: 18px; top: 470px; width: 96px; height: 96px; border-radius: 50%; background: #F4914D; z-index: 3; display: flex; align-items: center; justify-content: center">
    <svg class="spin" viewBox="0 0 200 200" width="96" height="96" aria-hidden="true" style="position: absolute; inset: 0"><defs><path id="mfb" d="M100,100 m-70,0 a70,70 0 1,1 140,0 a70,70 0 1,1 -140,0"></path></defs><text fill="#0B2A4F" font-family="Plus Jakarta Sans, sans-serif" font-size="17" font-weight="800"><textPath href="#mfb" textLength="436" lengthAdjust="spacing">AGENDA TU CITA ✦ TEJIDO HUMANO ✦ </textPath></text></svg>
    <span style="color: #0B2A4F; font-size: 22px; font-weight: 800">↗</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { s: 0 }; }
  componentDidMount() { this.t = setInterval(() => this.setState({ s: (this.state.s + 1) % 3 }), 7000); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const S = [
      { tag: 'PROYECTO SOLAR', h: 'De Washington a *Ciudad *Bolívar.', lead: 'Planta solar fotovoltaica de 11,05 MWp en el sur de Bogotá.' },
      { tag: 'CENTRO DE CONCILIACIÓN', h: 'Resolvemos conflictos con *diálogo.', lead: 'Adscrito al Ministerio de Justicia y del Derecho.' },
      { tag: 'DIPLOMADOS', h: 'Formación para *transformar.', lead: 'Educación de calidad, oportunidades para todos.' }
    ];
    const s = this.state.s;
    const c = S[s];
    const words = c.h.split(' ').map((w, i) => { const k = w.startsWith('*'); return { t: w.replace('*', ''), c: k ? '#FFC9A3' : '#FFFFFF', cls: k ? 'w ser' : 'w', d: (0.08 + i * 0.08).toFixed(2) + 's' }; });
    const tabs = S.map((x, i) => ({ label: x.tag, active: i === s, pick: () => this.setState({ s: i }) }));
    return { cur: Object.assign({}, c, { words }), tabs };
  }
}
</script>
</body>
</html>
