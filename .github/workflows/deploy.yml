# Publica la exportación estática en GitHub Pages en cada push a main.
# URL: https://dewys-eguis.github.io/fundacion-derecho-formacion/
# Render (render.yaml) no usa este workflow: compila sin NEXT_PUBLIC_BASE_PATH, desde la raíz.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /fundacion-derecho-formacion
      # Sin Jekyll: conserva las carpetas que empiezan por «_» (_next, images/_opt)
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
