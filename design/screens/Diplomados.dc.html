<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Diplomados — Tejido Humano</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.card{transition:transform .3s ease, box-shadow .3s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 48px rgba(11,42,79,.12)}
</style>
</helmet>
<div style="width: 1440px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0B2A4F; background: #FFFFFF">
<dc-import name="Header" active="diplomados" hint-size="1440px,128px"></dc-import>
<dc-import name="PageBanner" crumb="Diplomados" eyebrow="Diplomados virtuales gratis" heading="21 diplomados para transformar el aula." lead="La inscripción y el estudio son gratuitos; solo se paga el certificado. Inteligencia artificial, pedagogía, inclusión, tecnología y seguridad en el trabajo." photo="educadores en formación virtual" art="educacion" hint-size="1440px,512px"></dc-import>

<section style="padding: 72px 48px 0">
  <div style="padding: 12px; background: #F3F8FE; border-radius: 26px; display: flex; gap: 12px; align-items: center">
    <label style="flex: 1; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: #FFFFFF; border-radius: 18px">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="#51617A" stroke-width="1.6"></circle><path d="M11 11l3.5 3.5" stroke="#51617A" stroke-width="1.6"></path></svg>
      <input type="search" aria-label="Buscar diplomado" placeholder="Buscar diplomado…" onChange="{{onSearch}}" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 16px; color: #0B2A4F">
    </label>
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
      <button type="button" onClick="{{f.pick}}" style="height: 56px; padding: 0 18px; border: 0; border-radius: 18px; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{f.label}}</button>
    </sc-for>
  </div>
  <div style="margin-top: 20px; font-size: 14px; font-weight: 600; color: #51617A">Mostrando {{count}} de 21 diplomados</div>
  <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{courses}}" as="c" hint-placeholder-count="21">
      <a href="Contacto.dc.html" class="card" style="padding: 28px; min-height: 260px; box-sizing: border-box; border: 1px solid #DCE6F2; border-radius: 26px; background: #FFFFFF; text-decoration: none; color: #0B2A4F; display: flex; flex-direction: column; justify-content: space-between">
        <span style="display: flex; justify-content: space-between; align-items: center"><span style="padding: 6px 12px; background: {{c.tagBg}}; color: {{c.tagFg}}; border-radius: 999px; font-size: 12px; font-weight: 800">{{c.cat}}</span><span style="font-size: 12px; font-weight: 700; color: #51617A">Virtual · Gratis</span></span>
        <span style="margin-top: 18px; font-size: 22px; font-weight: 800; line-height: 1.2">{{c.t}}</span>
        <span style="margin-top: 10px; font-size: 14px; line-height: 1.55; color: #51617A">{{c.d}}</span>
        <span style="margin-top: 18px; padding-top: 16px; border-top: 1px solid #DCE6F2; display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; color: #B5531A">Inscribirme gratis <span>→</span></span>
      </a>
    </sc-for>
  </div>
</section>

<div style="height: 112px"></div>
<dc-import name="Footer" hint-size="1440px,680px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'all', q: '' }; }
  renderVals() {
    const C = [
      ['ped', 'Storytelling aplicado a la educación', 'Narrativas para conectar con los estudiantes y hacer memorable el contenido.'],
      ['ped', 'Diseño instruccional: crea experiencias de aprendizaje que dejan huella', 'Fundamentos para crear cursos virtuales efectivos.'],
      ['tec', 'Innova en el aula con H5P', 'Recursos digitales interactivos y accesibles con H5P.'],
      ['ped', 'Diseña para impactar: Design Thinking para docentes', 'Pensamiento de diseño para resolver necesidades reales del aula.'],
      ['tec', 'Canva para educadores', 'Materiales visuales, presentaciones e infografías para las clases.'],
      ['ia', 'Domina el lenguaje de los bots: Prompting para educadores', 'Redactar prompts para generar recursos y actividades con IA.'],
      ['tec', 'Dale forma a tus ideas: impresión 3D y prototipado', 'Prototipos educativos con impresión 3D y enfoque STEAM.'],
      ['ia', 'Genera recursos de aprendizaje con IA', 'Herramientas de IA para crear contenidos educativos personalizados.'],
      ['sst', 'Seguridad y Salud en el Trabajo SST', 'Prevención de riesgos laborales y cultura de seguridad.'],
      ['tec', 'Programación por Bloques', 'Juegos, animaciones e historias interactivas con Scratch.'],
      ['tec', 'Principios de la Robótica Educativa', 'Mecánica, electrónica y programación para proyectos robóticos en clase.'],
      ['ped', 'Palabras que Enseñan: Copywriting en la Educación', 'Escritura persuasiva para mensajes y materiales de aprendizaje.'],
      ['ped', 'Metodologías Colaborativas y Creativas para la Educación', 'Metodologías activas, cocreación y trabajo en equipo.'],
      ['ped', 'Jugamos y Aprendemos: Educación Basada en Juegos', 'Mecánicas de juego para motivar y desarrollar competencias.'],
      ['inc', 'Habilidades Digitales para Docentes', 'Competencias TIC para planificar, desarrollar y evaluar el aprendizaje.'],
      ['tec', 'Edugamer: Crea Videojuegos Educativos', 'Videojuegos educativos centrados en competencias.'],
      ['ia', 'Diseño de un GPT Personalizado en Educación', 'Un asistente educativo basado en GPT para tutoría y enseñanza.'],
      ['inc', 'Diseño Universal para el Aprendizaje DUA: Abriendo Puertas para la Inclusión', 'DUA y accesibilidad digital para una enseñanza inclusiva.'],
      ['ia', 'IA en la educación', 'Inteligencia artificial en personalización, evaluación e innovación.'],
      ['ia', 'Ciberciudadanía e Inteligencia Artificial: Formando Educadores Críticos', 'Mirada ética y crítica sobre la IA y la ciudadanía digital.'],
      ['ped', 'Aprendizaje Basado en Proyectos', 'Proyectos interdisciplinarios centrados en problemas reales.']
    ];
    const CAT = { ia: 'IA', ped: 'Pedagogía', tec: 'Tecnología', inc: 'Inclusión', sst: 'SST' };
    const st = this.state;
    const q = st.q.toLowerCase();
    const courses = C.filter(([k, t]) => (st.f === 'all' || k === st.f) && (!q || t.toLowerCase().includes(q)))
      .map(([k, t, d]) => ({ t, d, cat: CAT[k], tagBg: k === 'ia' ? '#FFF1E6' : '#EAF3FD', tagFg: k === 'ia' ? '#B5531A' : '#1E64C8' }));
    const F = [['all', 'Todos'], ['ia', 'IA'], ['ped', 'Pedagogía'], ['tec', 'Tecnología'], ['inc', 'Inclusión'], ['sst', 'SST']];
    return {
      courses, count: String(courses.length),
      filters: F.map(([k, label]) => ({ label, bg: k === st.f ? '#0B2A4F' : '#FFFFFF', fg: k === st.f ? '#FFFFFF' : '#0B2A4F', pick: () => this.setState({ f: k }) })),
      onSearch: (e) => this.setState({ q: e.target.value })
    };
  }
}
</script>
</body>
</html>
